# Runs are queued deliberately with the parameters below - never
# implicitly by pushes or pull requests.
trigger: none
pr: none

variables:
  - group: terraformBackend

parameters:
  # Environments this run deploys to - any combination can be picked.
  - name: deployRd
    displayName: Deploy to RD
    type: boolean
    default: true

  - name: deployDev
    displayName: Deploy to Dev
    type: boolean
    default: false

  - name: deployQa
    displayName: Deploy to QA
    type: boolean
    default: false

  - name: deployProduction
    displayName: Deploy to Production
    type: boolean
    default: false

  # Stages each selected environment's chain runs.
  - name: runValidate
    displayName: "Stage: Validate"
    type: boolean
    default: true

  - name: runPlan
    displayName: "Stage: Plan"
    type: boolean
    default: true

  - name: runSecurityScan
    displayName: "Stage: Security scan"
    type: boolean
    default: true

  - name: runApply
    displayName: "Stage: Apply (needs Plan)"
    type: boolean
    default: true

stages:
  - template: ../../templates/terraform-deploy.yml
    parameters:
      workloadName: event-pipeline

      terraformRoot: terraform/applications/event-pipeline
      tfvarsFolder: environments

      terraformVersion: "1.15.8"
      agentImage: ubuntu-latest

      runValidate: ${{ parameters.runValidate }}
      runPlan: ${{ parameters.runPlan }}
      runSecurityScan: ${{ parameters.runSecurityScan }}
      runApply: ${{ parameters.runApply }}

      trivyVersion: latest
      trivyScanners: misconfig,secret
      trivySeverities: HIGH,CRITICAL
      trivyExitCode: "1"

      # The Cosmos DB account's keys live in the Terraform state even
      # with local authentication disabled, and both the unredacted
      # JSON plan and the saved binary plan would expose them to anyone
      # who can read pipeline artifacts. Only the readable (redacted)
      # plan is published; the exact reviewed plan reaches the
      # approval-gated apply job through the state storage account
      # instead.
      publishJsonPlan: false
      publishSavedPlan: false

      applyOnPullRequests: false

      environments:
        rd:
          deploy: ${{ parameters.deployRd }}
          serviceConnection: azure-terraform-rd
          stateKey: event-pipeline-rd.tfstate
          azureDevOpsEnvironment: terraform-event-pipeline-rd

        dev:
          deploy: ${{ parameters.deployDev }}
          serviceConnection: azure-terraform-dev
          stateKey: event-pipeline-dev.tfstate
          azureDevOpsEnvironment: terraform-event-pipeline-dev

        qa:
          deploy: ${{ parameters.deployQa }}
          serviceConnection: azure-terraform-qa
          stateKey: event-pipeline-qa.tfstate
          azureDevOpsEnvironment: terraform-event-pipeline-qa

        production:
          deploy: ${{ parameters.deployProduction }}
          serviceConnection: azure-terraform-production
          stateKey: event-pipeline-production.tfstate
          azureDevOpsEnvironment: terraform-event-pipeline-production
