# Runs are queued deliberately with the parameters below - never
# implicitly by pushes or pull requests.
trigger: none
pr: none

variables:
  - group: terraformBackend

parameters:
  # Environments this run deploys to - any combination can be picked.
  - name: deployRd
    displayName: Deploy to RD
    type: boolean
    default: true

  - name: deployDev
    displayName: Deploy to Dev
    type: boolean
    default: false

  - name: deployQa
    displayName: Deploy to QA
    type: boolean
    default: false

  - name: deployProduction
    displayName: Deploy to Production
    type: boolean
    default: false

  # Stages each selected environment's chain runs.
  - name: runValidate
    displayName: "Stage: Validate"
    type: boolean
    default: true

  - name: runPlan
    displayName: "Stage: Plan"
    type: boolean
    default: true

  - name: runSecurityScan
    displayName: "Stage: Security scan"
    type: boolean
    default: true

  - name: runApply
    displayName: "Stage: Apply (needs Plan)"
    type: boolean
    default: true

stages:
  - template: ../../templates/terraform-deploy.yml
    parameters:
      workloadName: standalone-app

      terraformRoot: terraform/applications/standalone-app
      tfvarsFolder: environments

      terraformVersion: "1.15.8"
      # The stack deploys its own network, DNS zones and monitoring
      # into one subscription and looks nothing up in a hub or spoke,
      # so a hosted agent is enough: nothing in the plan reads a
      # private data plane.
      agentImage: ubuntu-latest

      runValidate: ${{ parameters.runValidate }}
      runPlan: ${{ parameters.runPlan }}
      runSecurityScan: ${{ parameters.runSecurityScan }}
      runApply: ${{ parameters.runApply }}

      trivyVersion: latest
      trivyScanners: misconfig,secret
      trivySeverities: HIGH,CRITICAL
      trivyExitCode: "1"

      # The generated Windows admin passwords live in the Terraform
      # state, and both the unredacted JSON plan and the saved binary
      # plan would expose them to anyone who can read pipeline
      # artifacts. Only the readable plan (which redacts sensitive
      # values) is published; the exact reviewed plan reaches the
      # approval-gated apply job through the access-controlled state
      # storage account instead.
      publishJsonPlan: false
      publishSavedPlan: false

      applyOnPullRequests: false

      environments:
        rd:
          deploy: ${{ parameters.deployRd }}
          serviceConnection: azure-terraform-rd
          stateKey: standalone-app-rd.tfstate
          azureDevOpsEnvironment: terraform-standalone-app-rd

        dev:
          deploy: ${{ parameters.deployDev }}
          serviceConnection: azure-terraform-dev
          stateKey: standalone-app-dev.tfstate
          azureDevOpsEnvironment: terraform-standalone-app-dev

        qa:
          deploy: ${{ parameters.deployQa }}
          serviceConnection: azure-terraform-qa
          stateKey: standalone-app-qa.tfstate
          azureDevOpsEnvironment: terraform-standalone-app-qa

        production:
          deploy: ${{ parameters.deployProduction }}
          serviceConnection: azure-terraform-production
          stateKey: standalone-app-production.tfstate
          azureDevOpsEnvironment: terraform-standalone-app-production
